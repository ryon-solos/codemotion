<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// A Code Motion film: the whole video written as code. The rules (also in the project's CLAUDE.md / AGENTS.md):
//   window.renderOut(t)  draws second t synchronously on this one canvas; any t, in any order
//                        (no Date.now(), no state carried between frames, no unseeded Math.random())
//   window.READY = true  once fonts and images are loaded
//   scene.json           { "duration": seconds }  — keep the timeline clip's length equal to it
(function () {
  const cv = document.getElementById('c'), g = cv.getContext('2d'), W = cv.width, H = cv.height;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const ease = x => { x = clamp(x); return 1 - Math.pow(1 - x, 4); };

  window.renderOut = function (t) {
    g.fillStyle = '#0b0b0c'; g.fillRect(0, 0, W, H);
    // a slow line that draws across
    g.strokeStyle = '#ff5f2e'; g.lineWidth = 6;
    g.beginPath(); g.moveTo(W * 0.2, H * 0.62); g.lineTo(W * 0.2 + W * 0.6 * ease((t - 0.4) / 1.6), H * 0.62); g.stroke();
    // title
    const k = ease((t - 0.2) / 1.0);
    g.globalAlpha = k; g.fillStyle = '#f2f2f3';
    g.font = `700 ${Math.round(W * 0.06)}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillText('Your film starts here', W / 2, H * 0.55 + (1 - k) * 30);
    g.globalAlpha = ease((t - 1.2) / 1.0); g.fillStyle = '#9a9aa1';
    g.font = `400 ${Math.round(W * 0.022)}px system-ui, sans-serif`;
    g.fillText('Ask your coding agent to write the story', W / 2, H * 0.7);
    g.globalAlpha = 1;
  };
  document.fonts.ready.then(() => { window.renderOut(0); window.READY = true; });
})();
</script>
</body>
</html>
